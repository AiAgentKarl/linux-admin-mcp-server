[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linux-admin-mcp-server"
version = "0.1.0"
description = "MCP server for Linux system administration — manage services, processes, disk, network and logs via AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AiAgentKarl", email = "coach1916@gmail.com" }]
keywords = ["mcp", "linux", "admin", "systemd", "sysadmin", "devops", "server", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastmcp>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/AiAgentKarl/linux-admin-mcp-server"
Repository = "https://github.com/AiAgentKarl/linux-admin-mcp-server"

[project.scripts]
linux-admin-mcp-server = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
